services:
  - type: web
    name: myhotel-web
    env: python
    plan: free
    region: oregon
    branch: main
    buildCommand: python -m pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate
    startCommand: python -m gunicorn hotel_management.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 90
