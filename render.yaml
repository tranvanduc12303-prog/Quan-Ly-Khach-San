services:
  - type: web
    name: myhotel-web
    env: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --verbosity 2
    releaseCommand: bash -lc "python manage.py create_admin --username admin_moi --email admin@hotel.com --password admin12345"
    startCommand: bash -lc "gunicorn hotel_management.wsgi:application --bind 0.0.0.0:${PORT:-10000} --workers 1 --timeout 120"
